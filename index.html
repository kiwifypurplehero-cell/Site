<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Xbox Purple Gaming Dashboard - Sua central de jogos com estilo">
  <meta name="theme-color" content="#581c87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XPGD">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="img/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>

  <!-- Critical CSS inlined -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-purple-500: #a855f7; --color-purple-600: #9333ea; --color-purple-700: #7e22ce;
      --color-surface-0: #0a0a0f; --color-surface-50: #11111a; --color-surface-100: #1a1a2e;
      --color-surface-200: #22223a; --color-surface-300: #2d2d4a; --color-surface-400: #3a3a5c;
      --color-text-primary: #ffffff; --color-text-secondary: #b8b8d0; --color-text-muted: #7a7a9a;
      --color-border: #333355; --color-border-focus: #c084fc; --color-glass: rgba(26,26,46,0.7);
      --space-4: 16px; --space-6: 24px; --space-8: 32px;
      --radius-md: 8px; --radius-lg: 12px; --radius-full: 9999px;
      --shadow-lg: 0 12px 32px -4px rgba(0,0,0,0.5); --shadow-glow: 0 0 32px rgba(168,85,247,0.25);
      --font-sans: 'Inter', system-ui, sans-serif; --font-display: 'Orbitron', var(--font-sans);
      --header-height: 64px; --sidebar-width: 280px; --sidebar-collapsed: 72px;
      --max-content-width: 1440px; --transition-base: 200ms ease-out;
      --focus-ring: 2px solid var(--color-border-focus); --focus-ring-offset: 2px;
      --z-fixed: 300; --z-modal-backdrop: 400; --z-modal: 500; --z-toast: 800;
    }
    html { font-size: 16px; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { margin: 0; font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; color: var(--color-text-primary); background: var(--color-surface-0); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .skip-link { position: absolute; top: -100%; left: var(--space-4); padding: 8px 16px; background: var(--color-purple-600); color: #0a0a0f; font-weight: 600; border-radius: var(--radius-md); z-index: var(--z-toast); transition: top var(--transition-base); }
    .skip-link:focus { top: var(--space-4); }
    .app-shell { display: grid; grid-template-rows: var(--header-height) 1fr; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
    .header { grid-column: 1 / -1; position: sticky; top: 0; z-index: var(--z-fixed); display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-6); background: rgba(10,10,15,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--color-border); }
    .header__logo { display: flex; align-items: center; gap: var(--space-3); text-decoration: none; color: var(--color-text-primary); flex-shrink: 0; }
    .header__logo-icon { width: 32px; height: 32px; }
    .header__logo-text { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, #fff, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .header__search { flex: 1; max-width: 480px; position: relative; }
    .header__search-btn { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); background: var(--color-surface-100); border: 1px solid var(--color-border); border-radius: var(--radius-full); color: var(--color-text-secondary); font-size: 0.875rem; transition: all var(--transition-base); }
    .header__search-btn:hover { background: var(--color-surface-200); border-color: var(--color-border-strong); color: var(--color-text-primary); }
    .header__search-btn:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
    .header__search-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .header__actions { display: flex; align-items: center; gap: var(--space-2); }
    .header__btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: var(--radius-full); background: transparent; color: var(--color-text-secondary); transition: all var(--transition-fast); }
    .header__btn:hover { background: var(--color-surface-100); color: var(--color-text-primary); }
    .header__btn:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
    .header__btn-icon { width: 22px; height: 22px; }
    .header__avatar { width: 40px; height: 40px; border-radius: var(--radius-full); border: 2px solid transparent; background: var(--color-surface-200); object-fit: cover; cursor: pointer; transition: all var(--transition-fast); }
    .header__avatar:hover { border-color: var(--color-purple-400); }
    .header__avatar:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
    .sidebar { position: sticky; top: var(--header-height); height: calc(100vh - var(--header-height)); background: var(--color-surface-50); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; overflow-y: auto; z-index: var(--z-sticky); transition: width var(--transition-base); }
    .sidebar--collapsed { width: var(--sidebar-collapsed); }
    .sidebar__nav { flex: 1; padding: var(--space-4); }
    .sidebar__list { display: flex; flex-direction: column; gap: var(--space-1); }
    .sidebar__item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); color: var(--color-text-secondary); text-decoration: none; font-weight: 500; font-size: 0.9375rem; transition: all var(--transition-fast); white-space: nowrap; }
    .sidebar__item:hover { background: var(--color-surface-100); color: var(--color-text-primary); }
    .sidebar__item:focus-visible { outline: var(--focus-ring); outline-offset: -2px; }
    .sidebar__item[aria-current="page"] { background: linear-gradient(90deg, rgba(168,85,247,0.15), transparent); color: var(--color-purple-300); border-left: 3px solid var(--color-purple-500); }
    .sidebar__item-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sidebar__item-label { opacity: 1; transition: opacity var(--transition-fast), width var(--transition-fast); overflow: hidden; }
    .sidebar--collapsed .sidebar__item-label { opacity: 0; width: 0; }
    .sidebar__collapse-btn { display: none; align-items: center; justify-content: center; width: 100%; padding: var(--space-3); margin-top: auto; background: transparent; border-top: 1px solid var(--color-border); color: var(--color-text-muted); }
    .sidebar__collapse-btn:hover { color: var(--color-text-primary); background: var(--color-surface-100); }
    .sidebar__collapse-icon { width: 24px; height: 24px; transition: transform var(--transition-base); }
    .sidebar--collapsed .sidebar__collapse-icon { transform: rotate(180deg); }
    .main { padding: var(--space-6); max-width: var(--max-content-width); width: 100%; margin-left: auto; overflow-x: hidden; }
    .page { display: none; animation: fadeIn var(--transition-base) ease-out; }
    .page--active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .container { width: 100%; max-width: var(--max-content-width); margin: 0 auto; padding: 0 var(--space-6); }
    @media (max-width: 1023px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: 0; top: var(--header-height); width: var(--sidebar-mobile); height: calc(100vh - var(--header-height)); transform: translateX(-100%); box-shadow: var(--shadow-xl); border-right: none; z-index: var(--z-fixed); }
      .sidebar--mobile-open { transform: translateX(0); }
      .sidebar__collapse-btn { display: flex; }
      .main { padding: var(--space-4); }
      .header__search { max-width: none; }
      .header__btn:not(.header__btn--menu) { display: none; }
    }
    @media (min-width: 1024px) {
      .header__btn--menu { display: none; }
    }
    @media (min-width: 1920px) {
      html { font-size: 18px; }
      :root { --header-height: 72px; --sidebar-width: 320px; --space-6: 32px; --space-8: 48px; }
    }
  </style>

  <!-- Deferred CSS -->
  <link rel="preload" as="style" href="css/layout.css" onload="this.rel='stylesheet'">
  <link rel="preload" as="style" href="css/components.css" onload="this.rel='stylesheet'">
  <link rel="preload" as="style" href="css/utilities.css" onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
  </noscript>

  <title>Xbox Purple Gaming Dashboard</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <div class="app-shell">
    <header class="header" role="banner">
      <a href="#home" class="header__logo" aria-label="Xbox Purple Gaming Dashboard - Início">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="url(#logoGrad)"/>
          <path d="M8 8 L24 24 M24 8 L8 24" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#581c87"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="header__logo-text">XPGD</span>
      </a>

      <div class="header__search" role="search">
        <button type="button" class="header__search-btn" id="search-btn" aria-label="Buscar jogos" aria-expanded="false" aria-controls="search-modal">
          <svg class="header__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Buscar jogos...</span>
          <kbd class="sr-only">⌘K</kbd>
        </button>
      </div>

      <div class="header__actions">
        <button type="button" class="header__btn header__btn--menu" id="menu-btn" aria-label="Abrir menu lateral" aria-expanded="false" aria-controls="sidebar">
          <svg class="header__btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button type="button" class="header__btn" aria-label="Notificações">
          <svg class="header__btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <img class="header__avatar" src="img/avatars/spartan.svg" alt="" aria-label="Menu do usuário">
      </div>
    </header>

    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Navegação principal">
      <nav class="sidebar__nav">
        <ul class="sidebar__list" role="list">
          <li><a href="#home" class="sidebar__item" data-page="home" aria-current="page"><span class="sidebar__item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="sidebar__item-label">Início</span></a></li>
          <li><a href="#library" class="sidebar__item" data-page="library"><span class="sidebar__item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="sidebar__item-label">Biblioteca</span></a></li>
          <li><a href="#store" class="sidebar__item" data-page="store"><span class="sidebar__item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 20v-8a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8"/><path d="M4 20v-8a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M4 4h16v2"/></svg></span><span class="sidebar__item-label">Loja</span></a></li>
          <li><a href="#profile" class="sidebar__item" data-page="profile"><span class="sidebar__item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="sidebar__item-label">Perfil</span></a></li>
          <li><a href="#settings" class="sidebar__item" data-page="settings"><span class="sidebar__item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="sidebar__item-label">Configurações</span></a></li>
        </ul>
      </nav>
      <button type="button" class="sidebar__collapse-btn" id="sidebar-collapse-btn" aria-label="Colapsar barra lateral" aria-expanded="true">
        <svg class="sidebar__collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </aside>

    <main class="main" id="main-content" role="main">
      <!-- Pages rendered here by router -->
      <section class="page page--active" id="page-home" role="region" aria-label="Início">
        <div class="container" id="app-home"></div>
      </section>
      <section class="page" id="page-library" role="region" aria-label="Biblioteca">
        <div class="container" id="app-library"></div>
      </section>
      <section class="page" id="page-store" role="region" aria-label="Loja">
        <div class="container" id="app-store"></div>
      </section>
      <section class="page" id="page-game-detail" role="region" aria-label="Detalhes do jogo">
        <div class="container" id="app-game-detail"></div>
      </section>
      <section class="page" id="page-profile" role="region" aria-label="Perfil">
        <div class="container" id="app-profile"></div>
      </section>
      <section class="page" id="page-settings" role="region" aria-label="Configurações">
        <div class="container" id="app-settings"></div>
      </section>
      <section class="page" id="page-404" role="region" aria-label="Página não encontrada">
        <div class="container" id="app-404"></div>
      </section>
    </main>
  </div>

  <!-- Search Modal -->
  <dialog class="modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Buscar jogos">
    <div class="modal__backdrop" tabindex="-1"></div>
    <div class="modal__panel modal__panel--full">
      <header class="modal__header">
        <h2 class="modal__title">Buscar jogos</h2>
        <button type="button" class="modal__close" aria-label="Fechar busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </header>
      <div class="modal__content">
        <div class="search-modal">
          <input type="search" class="search-modal__input" placeholder="Digite para buscar..." aria-label="Termo de busca" autocomplete="off" spellcheck="false">
          <div class="search-modal__results" role="listbox" aria-label="Resultados da busca"></div>
          <div class="search-modal__empty hidden">Nenhum jogo encontrado</div>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" role="region" aria-label="Notificações" aria-live="polite"></div>

  <!-- Deferred JS -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
