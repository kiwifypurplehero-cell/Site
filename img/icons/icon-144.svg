<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7e22ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Subtle pattern overlay -->
  <g opacity="0.08">
    <rect width="512" height="512" fill="url(#pattern)"/>
  </g>
  <defs>
    <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
      <circle cx="0" cy="0" r="1" fill="white"/>
      <circle cx="40" cy="40" r="1" fill="white"/>
    </pattern>
  </defs>
  <!-- X Logo -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <path d="M-80 -80 L80 80 M80 -80 L-80 80" stroke="url(#xGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner glow lines -->
    <path d="M-60 -60 L60 60 M60 -60 L-60 60" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Accent ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="2"/>
</svg>