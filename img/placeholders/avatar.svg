<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="avatarAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#avatarGrad)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#avatarAccent)" stroke-width="2" opacity="0.3"/>
  <!-- Generic user silhouette -->
  <g transform="translate(64, 64)" fill="url(#avatarAccent)" opacity="0.6">
    <circle cx="0" cy="-18" r="18"/>
    <ellipse cx="0" cy="35" rx="30" ry="25"/>
  </g>
  <!-- Editable overlay indicator (hidden by default, shown via CSS) -->
  <g class="edit-overlay" opacity="0" transform="translate(64, 64)">
    <circle cx="38" cy="38" r="18" fill="#a855f7"/>
    <path d="M30 38 L38 46 M38 30 L46 38" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>