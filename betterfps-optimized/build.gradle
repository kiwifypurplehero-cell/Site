buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://libraries.minecraft.net' }
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.4.8-optimized"
group = "com.mtz.betterfps"
archivesBaseName = "BetterFps-Optimized"

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "snapshot_20171003"
    
    // Use local forge jar instead of maven
    forgeVersion = "14.23.5.2860"
}

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net' }
    jcenter()
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    compileOnly files('libs/BetterFps-1.4.8.jar')
    // Use the forge jar directly
    compileOnly files('/tmp/forge-1.12.2-14.23.5.2860.jar')
}

jar {
    manifest {
        attributes(
            'Main-Class': 'net.minecraft.launchwrapper.Launch',
            'FMLCorePlugin': 'guichaguri.betterfps.tweaker.BetterFpsTweaker',
            'MCVersion': '1.12.2',
            'Mod-Version': "${version}",
            'Mod-Name': 'BetterFps Optimized'
        )
    }
    from('src/main/resources') {
        include 'assets/**'
        include 'betterfps.srg'
        include 'META-INF/betterfps.json'
    }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

tasks.compileJava.doLast {
    copy {
        from 'src/main/resources'
        into 'build/resources/main'
        include 'assets/**'
        include 'betterfps.srg'
        include 'META-INF/betterfps.json'
    }
}
