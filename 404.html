<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — darkplp</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f3fa" media="(prefers-color-scheme: light)">
  <style>
    .error-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; gap: 1.5rem; }
    .error-code { font-size: clamp(6rem, 20vw, 12rem); font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.03em; }
    .error-title { margin: 0; font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 700; color: var(--fg); }
    .error-desc { margin: 0; max-width: 400px; color: color-mix(in srgb, var(--fg) 70%, transparent); font-size: 1.1rem; line-height: 1.6; }
    .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.875rem 1.75rem; border-radius: var(--radius); font-weight: 600; font-size: 1rem; text-decoration: none; transition: transform var(--transition), box-shadow var(--transition); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
    .btn-secondary { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--fg); backdrop-filter: blur(12px) saturate(180%); }
    .btn-secondary:hover { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
    .glitch { position: relative; animation: glitch 3s ease-in-out infinite; }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, 0); }
      80% { transform: translate(2px, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .glitch { animation: none; } }
  </style>
</head>
<body>
  <main class="error-container">
    <h1 class="error-code glitch" aria-hidden="true">404</h1>
    <h2 class="error-title">Página não encontrada</h2>
    <p class="error-desc">O portal para esse jogo ainda não foi aberto… ou o link se perdeu no void.</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="index.html">← Voltar ao catálogo</a>
      <a class="btn btn-secondary" href="https://darkplp.org" target="_blank" rel="noopener">Dark-PLP.org</a>
    </div>
  </main>
  <script>
    // Sync theme from localStorage
    const saved = localStorage.getItem('darkplp-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  </script>
</body>
</html>
