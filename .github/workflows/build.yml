name: Build BetterFps Optimized

on:
  push:
    branches: [main, fresh-main]
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]

jobs:
  build:
    name: Build for Minecraft 1.12.2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.10.3'

      - name: Fix gradlew Java path
        run: |
          sed -i 's|/usr/lib/jvm/java-8-openjdk-amd64/bin/java|${JAVA_HOME}/bin/java|' betterfps-optimized/gradlew
          chmod +x betterfps-optimized/gradlew

      - name: Download and install Forge artifacts
        run: |
          set -e
          cd betterfps-optimized

          # Create ForgeGradle cache structure
          mkdir -p ~/.gradle/caches/modules-2/files-2.1/net.minecraftforge/forge/1.12.2-14.23.5.2860
          mkdir -p ~/.gradle/caches/modules-2/files-2.1/net.minecraftforge/gradle/ForgeGradle/2.3-SNAPSHOT

          # Download Forge installer (contains all artifacts)
          echo "Downloading Forge installer..."
          wget -q "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-installer.jar" \
            -O /tmp/forge-installer.jar || {
            echo "Trying files.minecraftforge.net..."
            wget -q "https://files.minecraftforge.net/maven/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-installer.jar" \
              -O /tmp/forge-installer.jar || {
              echo "ERROR: Could not download Forge installer"
              exit 1
            }
          }

          # Run installer to extract artifacts to gradle cache
          echo "Installing Forge artifacts..."
          cd /tmp
          java -jar forge-installer.jar --installClient 2>&1 | tail -20

          # Copy installed artifacts to gradle cache
          if [ -d ~/.minecraft/libraries/net/minecraftforge/forge/1.12.2-14.23.5.2860 ]; then
            cp -r ~/.minecraft/libraries/net/minecraftforge/forge/1.12.2-14.23.5.2860/* \
              ~/.gradle/caches/modules-2/files-2.1/net.minecraftforge/forge/1.12.2-14.23.5.2860/ 2>/dev/null || true
          fi

          # Also try to find and copy userdev jar
          find ~/.minecraft -name "*userdev*.jar" -exec cp {} ~/.gradle/caches/modules-2/files-2.1/net.minecraftforge/forge/1.12.2-14.23.5.2860/ \; 2>/dev/null || true

          # Download ForgeGradle plugin
          echo "Downloading ForgeGradle..."
          wget -q "https://repo.maven.apache.org/maven2/net/minecraftforge/gradle/ForgeGradle/2.3-SNAPSHOT/ForgeGradle-2.3-20180610.215539-1.jar" \
            -O ~/.gradle/caches/modules-2/files-2.1/net.minecraftforge/gradle/ForgeGradle/2.3-SNAPSHOT/ForgeGradle-2.3-20180610.215539-1.jar 2>/dev/null || echo "ForgeGradle download failed, will try maven"

      - name: Build BetterFps Optimized
        working-directory: ./betterfps-optimized
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          ./gradlew setupDecompWorkspace build --stacktrace --info

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterFps-Optimized
          path: betterfps-optimized/build/libs/*.jar
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: betterfps-optimized/build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}