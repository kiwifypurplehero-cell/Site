<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#080a12">
  <title>Jogar — PlumpGames</title>
  <link rel="stylesheet" href="play.css">
  <script src="play-utils.js" defer></script>
  <script type="module" src="play.js"></script>
</head>
<body>
  <header class="play-toolbar">
    <h1 id="game-name">PlumpGames</h1>
    <div class="settings-control">
      <button id="game-settings-button" type="button" aria-label="Configurações do jogo" aria-haspopup="menu" aria-expanded="false" aria-controls="game-settings-menu">⚙</button>
      <section id="game-settings-menu" class="settings-menu" role="menu" aria-label="Configurações do jogo" hidden>
        <div id="settings-main" class="menu-view">
          <button type="button" role="menuitem" data-command="fullscreen">Tela cheia</button>
          <button type="button" role="menuitem" data-view="resolution">Resolução <span aria-hidden="true">›</span></button>
          <button type="button" role="menuitem" data-command="restart">Reiniciar</button>
          <button type="button" role="menuitem" data-view="loadouts">Loadouts <span aria-hidden="true">›</span></button>
          <button type="button" role="menuitem" data-command="close">Fechar</button>
        </div>
        <div id="resolution-view" class="menu-view" hidden>
          <header><button type="button" data-back aria-label="Voltar">‹</button><h2>Resolução</h2></header>
          <div id="resolution-options"></div>
        </div>
        <div id="loadouts-view" class="menu-view loadouts-view" hidden>
          <header><button type="button" data-back aria-label="Voltar">‹</button><h2>Loadouts</h2></header>
          <div id="loadouts-content"></div>
        </div>
      </section>
    </div>
  </header>
  <main id="game-area">
    <div id="game-stage" tabindex="-1">
      <div id="game-resolution-frame"><iframe id="game-frame" title="Jogo" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="loadout-overlay" aria-label="Controles virtuais do jogo"></div></div>
    </div>
    <section id="loading" class="notice" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><strong>Carregando jogo...</strong></section>
    <section id="error" class="notice" role="alert" hidden><strong>Não foi possível carregar o jogo.</strong><p>O jogo pode estar indisponível ou impedir a exibição nesta página.</p><div><button id="retry" type="button">Tentar novamente</button><a id="direct" target="_blank" rel="noopener noreferrer">Abrir jogo diretamente</a></div></section>
  </main>
  <section id="ldt-panel" class="ldt-panel" aria-label="Editor de LDT" hidden></section>
  <p id="message" class="message" role="status" aria-live="polite" hidden></p>
</body>
</html>
