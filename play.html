<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogando — darkplp</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f3fa" media="(prefers-color-scheme: light)">
  <style>
    .play-container { display: flex; flex-direction: column; height: 100vh; }
    .play-header { padding: 1rem clamp(1rem, 5vw, 3rem); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; gap: 1rem; }
    .play-title { font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .play-frame { flex: 1; position: relative; background: #000; }
    .play-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    .dev-banner { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); background: rgba(168,85,247,0.95); color: #fff; padding: 0.5rem 1.5rem; border-radius: 999px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; box-shadow: 0 0 24px var(--accent-glow); z-index: 10; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 16px var(--accent-glow); } 50% { box-shadow: 0 0 32px var(--accent-glow); } }
    @media (prefers-reduced-motion: reduce) { .dev-banner { animation: none; } }
    .play-error { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; text-align: center; }
    .play-error h2 { margin: 0; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .play-error a { display: inline-block; margin-top: 0.5rem; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; border-radius: var(--radius); text-decoration: none; font-weight: 600; transition: transform var(--transition), box-shadow var(--transition); }
    .play-error a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
  </style>
</head>
<body>
  <div class="play-container">
    <header class="play-header">
      <a href="index.html" style="color:var(--fg);text-decoration:none;font-weight:600;">← darkplp</a>
      <h1 class="play-title" id="game-title">Carregando…</h1>
    </header>
    <main class="play-frame" id="play-frame"></main>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    const frame = document.getElementById('play-frame');
    const titleEl = document.getElementById('game-title');

    // In a real app, fetch from games.json; for now hardcoded map
    const GAME_MAP = {
      'game-1': { title: 'Cyberpunk 2077', url: 'https://example.com/play/cyberpunk' },
      'game-2': { title: 'Elden Ring', url: 'https://example.com/play/elden-ring' },
      'game-3': { title: "Baldur's Gate 3", url: 'https://example.com/play/bg3' }
    };

    const game = GAME_MAP[gameId];
    if (game) {
      titleEl.textContent = game.title;
      frame.innerHTML = `
        <div class="dev-banner">Em desenvolvimento</div>
        <iframe src="${game.url}" allow="fullscreen; gamepad; autoplay" referrerpolicy="no-referrer"></iframe>
      `;
    } else {
      frame.innerHTML = '';
      frame.classList.add('play-error');
      frame.innerHTML = `
        <h2>Jogo não encontrado</h2>
        <p>O jogo solicitado não existe ou o link está incorreto.</p>
        <a href="index.html">Voltar ao catálogo</a>
      `;
    }

    // Theme sync from localStorage
    const saved = localStorage.getItem('darkplp-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  </script>
</body>
</html>
