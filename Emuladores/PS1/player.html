<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#05060a">
  <style>#loading{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:#05060a;color:#fff;font:16px system-ui}#loading[hidden]{display:none!important}#progress-track{width:min(420px,82vw);height:10px;border-radius:99px;background:#ffffff22;overflow:hidden}#progress-bar{display:block;width:0;height:100%;background:#8b5cf6}</style><title>PlayStation 1 — PlumpGames</title>
  <link rel="stylesheet" href="/Emuladores/PS1/ps1.css">
  <link rel="stylesheet" href="/Emuladores/shared/emulator-common.css">
  <script type="module" src="/Emuladores/PS1/ps1-player.js"></script>
</head>
<body>
  <header id="toolbar"><a id="back" href="/Emuladores/PS1/">← Voltar para PlumpGames</a><strong id="game-name">PlayStation 1</strong></header>
  <main id="ps1-player-shell">
    <div id="ps1-emulator"></div>
    <button id="settings-toggle" type="button" aria-label="Configurações" aria-expanded="false" aria-controls="settings">⚙</button>
    <section id="loading" role="status" aria-live="polite">
      <h1 id="loading-game">PlayStation 1</h1>
      <b id="loading-phase">Preparando emulador</b>
      <div id="progress-track" role="progressbar" aria-label="Progresso do carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress-bar"></i></div>
      <strong id="loading-percent">0%</strong><small id="files-progress">Arquivos: 0%</small><small id="initialization-progress">Inicialização: 0%</small><dl id="initialization-details" hidden></dl>
      <div id="loading-details" hidden><span id="loading-bytes"></span><span id="loading-speed"></span><span id="loading-eta"></span></div>
      <div id="initializing" hidden><span class="spinner"></span><span id="initializing-text">Inicializando PCSX-ReARMed…</span></div>
      <button id="cancel" type="button">Cancelar</button>
    </section>
    <section id="error" hidden><b>Não foi possível iniciar o jogo.</b><p></p><div class="error-actions"><button id="compatibility" type="button">Tentar modo compatível</button><button id="retry" type="button">Tentar novamente</button><button id="error-back" type="button">Voltar</button></div></section>
    <button id="fullscreen-prompt" type="button" hidden>Entrar em tela cheia e iniciar</button>
    <div id="settings-backdrop" hidden></div>
    <aside id="settings" hidden role="dialog" aria-label="Configurações do emulador">
      <button id="settings-close" type="button" aria-label="Fechar configurações">×</button>
      <label>Perfil de desempenho<select id="profile"><option value="auto">Automático</option><option value="quality">Qualidade</option><option value="balanced">Equilibrado</option><option value="maximum">Desempenho máximo</option><option value="compatible">Compatível</option></select></label>
      <label>Frameskip<select id="frameskip"><option value="auto">Automático</option><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
      <label>Áudio<select id="audio"><option value="balanced">Equilibrado</option><option value="low">Baixa latência</option><option value="stable">Estável</option></select></label>
      <button id="fullscreen" type="button">Tela cheia</button><button id="restart" type="button">Reiniciar</button><button id="diagnostics-toggle" type="button">FPS/diagnóstico</button><label><input id="details-toggle" type="checkbox"> Mostrar detalhes de inicialização</label>
      <p class="bios-note">BIOS HLE pode apresentar menor compatibilidade.</p><dl id="diagnostics" hidden></dl><div id="controls-settings"></div>
    </aside>
  </main>
</body>
</html>
