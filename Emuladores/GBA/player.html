<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030508"><style>#loading{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:#05060a;color:#fff;font:16px system-ui}#loading[hidden]{display:none!important}#progress-track{width:min(420px,82vw);height:10px;border-radius:99px;background:#ffffff22;overflow:hidden}#progress-bar{display:block;width:0;height:100%;background:#8b5cf6}</style><title>Game Boy Advance — PlumpGames</title><link rel="stylesheet" href="/Emuladores/GBA/gba.css"><link rel="stylesheet" href="/Emuladores/shared/emulator-common.css"><script type="module" src="/Emuladores/GBA/gba-player.js"></script></head><body><main id="gba-shell"><div id="gba-emulator"></div>
<section id="loading" role="status" aria-live="polite"><h1 id="game-name">Preparando</h1><div id="progress-track"><i id="progress-bar"></i></div><b id="loading-percent">0%</b><p id="loading-phase">Preparando</p><small id="files-progress">Arquivos: 0%</small><small id="initialization-progress">Inicialização: 0%</small><dl id="initialization-details" hidden></dl></section>
<section id="error" role="alert" hidden><p></p><div><button id="retry">Tentar novamente</button><button id="compatibility">Modo compatível</button><a href="/Emuladores/GBA/">Voltar</a></div></section>
<button id="fullscreen-prompt" hidden>Tela cheia</button><button id="settings-toggle" aria-label="Abrir configurações">⚙</button><div id="backdrop" hidden></div><aside id="settings" hidden><button id="settings-close" aria-label="Fechar">×</button><h2>Configurações</h2>
<button id="fullscreen">Tela cheia</button><label>Perfil de desempenho<select id="performance"><option value="auto">Automático</option><option value="quality">Qualidade</option><option value="balanced" selected>Equilibrado</option><option value="maximum">Desempenho máximo</option></select></label><label>Frameskip<select id="frameskip"><option value="auto">Automático</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><label>Áudio<select id="audio"><option value="low">Baixa latência</option><option value="balanced" selected>Equilibrado</option><option value="stable">Estável</option></select></label><label>BIOS local (opcional)<input id="bios" type="file" accept=".bin,.rom"></label><small id="bios-status">Usando o comportamento padrão do core; nenhuma BIOS é baixada.</small><button id="save">Save State</button><button id="load">Load State</button><button id="restart">Reiniciar</button><label><input id="diagnostics-toggle" type="checkbox"> FPS/Diagnóstico</label><pre id="diagnostics" hidden></pre><a href="/Emuladores/GBA/">Sair do jogo</a><div id="controls-settings"></div></aside></main></body></html>
