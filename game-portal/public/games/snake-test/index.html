<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Test — GamePortal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #e8e8f0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ff2d75, #00ff88);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    canvas {
      border: 2px solid #2a2a3e;
      border-radius: 12px;
      box-shadow: 0 0 32px rgba(255, 45, 117, 0.2), 0 8px 24px rgba(0,0,0,0.4);
      background: #14141f;
      max-width: 100vw;
      max-height: 70vh;
    }
    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.875rem;
      color: #8a8a9e;
    }
    .controls kbd {
      background: #1a1a28;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    @media (max-width: 640px) {
      canvas { max-width: 95vw; max-height: 60vh; }
    }
  </style>
</head>
<body>
  <h1>🐍 Snake Test</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">
    <span>Controles: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
    <span>Espaço = Pausar</span>
  </div>

  <script>
    // Snake Game - minimal, self-contained
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [{x: 10, y: 10}];
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let food = {x: 15, y: 15};
    let score = 0;
    let gameLoop;
    let paused = false;
    let gameOver = false;

    const ACCENT = '#ff2d75';
    const ACCENT2 = '#00ff88';
    const BG = '#14141f';
    const GRID_COLOR = '#2a2a3e';

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      // Não spawnar em cima da cobra
      if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    function resetGame() {
      snake = [{x: 10, y: 10}];
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      score = 0;
      gameOver = false;
      spawnFood();
    }

    function update() {
      if (paused || gameOver) return;

      direction = {...nextDirection};
      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

      // Colisão parede
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver = true; return;
      }
      // Colisão si mesmo
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true; return;
      }

      snake.unshift(head);

      // Comeu comida
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        spawnFood();
        // Flash effect
        canvas.style.boxShadow = `0 0 48px ${ACCENT2}, 0 8px 24px rgba(0,0,0,0.4)`;
        setTimeout(() => canvas.style.boxShadow = `0 0 32px ${ACCENT}, 0 8px 24px rgba(0,0,0,0.4)`, 100);
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid sutil
      ctx.strokeStyle = GRID_COLOR;
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Food com pulso
      const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
      const foodSize = GRID * 0.8 * pulse;
      const foodOffset = (GRID - foodSize) / 2;

      const grad = ctx.createRadialGradient(
        food.x * GRID + GRID/2, food.y * GRID + GRID/2, 0,
        food.x * GRID + GRID/2, food.y * GRID + GRID/2, foodSize/2
      );
      grad.addColorStop(0, ACCENT2);
      grad.addColorStop(1, ACCENT);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(
        food.x * GRID + GRID/2,
        food.y * GRID + GRID/2,
        foodSize/2, 0, Math.PI * 2
      );
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        const t = i / snake.length;

        // Gradiente corpo
        const bodyGrad = ctx.createLinearGradient(
          seg.x * GRID, seg.y * GRID,
          seg.x * GRID + GRID, seg.y * GRID + GRID
        );
        bodyGrad.addColorStop(0, isHead ? ACCENT2 : `rgba(0, 255, 136, ${0.9 - t * 0.5})`);
        bodyGrad.addColorStop(1, isHead ? ACCENT : `rgba(255, 45, 117, ${0.7 - t * 0.4})`);

        ctx.fillStyle = bodyGrad;
        const radius = isHead ? 6 : 4;
        const padding = isHead ? 2 : 3;

        ctx.beginPath();
        ctx.roundRect(
          seg.x * GRID + padding,
          seg.y * GRID + padding,
          GRID - padding * 2,
          GRID - padding * 2,
          radius
        );
        ctx.fill();

        // Olhos na cabeça
        if (isHead) {
          ctx.fillStyle = '#0d0d12';
          const eyeOffset = direction.x !== 0 ? 6 : 0;
          const eyeOffsetY = direction.y !== 0 ? 6 : 0;
          ctx.beginPath();
          ctx.arc(seg.x * GRID + GRID/2 - 4 + eyeOffset, seg.y * GRID + GRID/2 - 3 + eyeOffsetY, 2, 0, Math.PI * 2);
          ctx.arc(seg.x * GRID + GRID/2 + 4 + eyeOffset, seg.y * GRID + GRID/2 - 3 + eyeOffsetY, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Score
      ctx.fillStyle = '#e8e8f0';
      ctx.font = '600 1.5rem "Space Grotesk", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 20, 35);

      // Game Over overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(13, 13, 18, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = ACCENT;
        ctx.font = '700 2.5rem "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);

        ctx.fillStyle = '#e8e8f0';
        ctx.font = '500 1.2rem "Space Grotesk", sans-serif';
        ctx.fillText(`Score Final: ${score}`, canvas.width/2, canvas.height/2 + 30);

        ctx.font = '400 1rem "Space Grotesk", sans-serif';
        ctx.fillStyle = '#8a8a9e';
        ctx.fillText('Espaço para reiniciar', canvas.width/2, canvas.height/2 + 70);
      } else if (paused) {
        ctx.fillStyle = 'rgba(13, 13, 18, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = ACCENT2;
        ctx.font = '700 2rem "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSADO', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#8a8a9e';
        ctx.font = '400 1rem "Space Grotesk", sans-serif';
        ctx.fillText('Espaço para continuar', canvas.width/2, canvas.height/2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      gameLoop = requestAnimationFrame(loop);
    }

    // Input
    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();

      if (key === ' ' || key === 'space') {
        e.preventDefault();
        if (gameOver) {
          resetGame();
        } else {
          paused = !paused;
        }
        return;
      }

      if (paused || gameOver) return;

      const dirs = {
        'arrowup': {x: 0, y: -1}, 'w': {x: 0, y: -1},
        'arrowdown': {x: 0, y: 1}, 's': {x: 0, y: 1},
        'arrowleft': {x: -1, y: 0}, 'a': {x: -1, y: 0},
        'arrowright': {x: 1, y: 0}, 'd': {x: 1, y: 0}
      };

      if (dirs[key]) {
        const newDir = dirs[key];
        // Não pode voltar 180°
        if (!(newDir.x === -direction.x && newDir.y === -direction.y)) {
          nextDirection = newDir;
        }
      }
    });

    // Touch para mobile
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    }, {passive: true});

    canvas.addEventListener('touchend', e => {
      if (!touchStart || paused || gameOver) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30 && direction.x !== -1) nextDirection = {x: 1, y: 0};
        else if (dx < -30 && direction.x !== 1) nextDirection = {x: -1, y: 0};
      } else {
        if (dy > 30 && direction.y !== -1) nextDirection = {x: 0, y: 1};
        else if (dy < -30 && direction.y !== 1) nextDirection = {x: 0, y: -1};
      }
      touchStart = null;
    }, {passive: true});

    // Start
    resetGame();
    loop();

    // Resize handler
    function resizeCanvas() {
      const maxW = Math.min(600, window.innerWidth * 0.95);
      const maxH = Math.min(600, window.innerHeight * 0.7);
      const size = Math.min(maxW, maxH);
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
